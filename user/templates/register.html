{% extends 'blog/base.html' %}

{% block content %}

        <div class="form-group p-4" style="border: 1px solid #ccc;">
          {{form|crispy}}

            <small>إذا كان لديك حساب من قبل فيمكنك  <a href="{% url 'login' %}">تسجيل الدخول</a></small>

        </div>

{% endblock %}
